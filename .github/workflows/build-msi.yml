name: Build Garage Gestion MSI
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install WiX Toolset 3.14
        shell: powershell
        run: choco install wixtoolset --version=3.14.1 -y --no-progress
      - name: Build application
        shell: powershell
        run: msbuild src/GarageGestion/GarageGestion.csproj /p:Configuration=Release /p:Platform=AnyCPU /m
      - name: Build MSI
        shell: powershell
        run: |
          $candle = "$env:ProgramFiles(x86)\WiX Toolset v3.14\bin\candle.exe"
          $light = "$env:ProgramFiles(x86)\WiX Toolset v3.14\bin\light.exe"
          & $candle -dAppOutput="$PWD\src\GarageGestion\bin\Release" -out installer\GarageGestion.wixobj installer\GarageGestion.wxs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $light -out GarageGestion-Setup.msi installer\GarageGestion.wixobj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: GarageGestion-Setup
          path: GarageGestion-Setup.msi
          if-no-files-found: error