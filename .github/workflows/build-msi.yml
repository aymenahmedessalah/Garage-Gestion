name: Build Garage Gestion MSI
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Locate MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Locate WiX Toolset
        shell: powershell
        run: |
          $wix = "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin"
          if (!(Test-Path "$wix\candle.exe")) { throw "WiX Toolset 3.14 not found on runner." }
          Add-Content -Path $env:GITHUB_PATH -Value $wix
      - name: Build application
        shell: powershell
        run: msbuild src/GarageGestion/GarageGestion.csproj /p:Configuration=Release /p:Platform=AnyCPU /m
      - name: Build MSI
        shell: powershell
        run: |
          candle.exe -dAppOutput="$PWD\src\GarageGestion\bin\Release" -out installer\GarageGestion.wixobj installer\GarageGestion.wxs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          light.exe -out GarageGestion-Setup.msi installer\GarageGestion.wixobj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: GarageGestion-Setup
          path: GarageGestion-Setup.msi
          if-no-files-found: error